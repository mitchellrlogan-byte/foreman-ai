app = "foreman-ai"
primary_region = "ord"

[build]

[env]
  FOREMAN_PORT = "4040"
  NODE_ENV = "production"
  FOREMAN_DB = "/data/foreman.db"

[http_service]
  internal_port = 4040
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "foreman_data"
  destination = "/data"
  initial_size = "1gb"
